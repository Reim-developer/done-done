name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint + validate skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skill frontmatter and structure
        run: python tests/validate.py

      - name: Check Markdown files parse
        run: |
          python - <<'PY'
          from pathlib import Path
          bad = []
          for md in Path(".").rglob("*.md"):
              text = md.read_text(encoding="utf-8")
              if text.count("```") % 2 != 0:
                  bad.append(f"{md}: unbalanced code fences")
          if bad:
              print("Markdown problems:")
              print("\n".join(bad))
              raise SystemExit(1)
          print("Markdown OK")
          PY
